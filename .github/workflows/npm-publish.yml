# This workflow automatically publishes a new version to npm based on conventional commits.
# It analyzes commits, bumps the version, and publishes to npm using semantic-release.

name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write        # Required to push commits and tags
  issues: write          # Required to create failure issues
  pull-requests: write   # Optional: required if managing PRs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required by semantic-release to analyze full git history
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      
      - run: npm run build
      
      - run: npm test
      
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

